# fly.toml app configuration file generated for thequantumfinancialhub on 2026-09-25T10:40:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'thequantumfinancialhub'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'off'      # disable Fly's automatic stop logic
  auto_start_machines = false     # do NOT wake on incoming requests
  min_machines_running = 0        # allow all machines to be fully stopped
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024